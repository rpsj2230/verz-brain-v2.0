[project]
name = "verz-brain"
version = "0.1.0"
description = "Company Brain — a permission-aware AI platform over a company's own business data"
requires-python = ">=3.13,<3.14"
dependencies = [
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0",
    "alembic>=1.14",
    "psycopg[binary,pool]>=3.2",
    "httpx>=0.28",
    "structlog>=24.4",
    "redis>=5.2",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "mypy>=1.13",
    "ruff>=0.8",
    "pyyaml>=6.0.3",
    "types-pyyaml>=6.0.12.20260815",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/brain"]

# ---------------------------------------------------------------- ruff
[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "SIM", "RUF", "ANN", "S", "PTH"]
ignore = [
    "ANN401",  # typing.Any is deliberate in the envelope
    "S101",    # assert is how the invariant suite reads
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN", "S105", "S106", "S603", "S607"]  # tests build real git repos
# N818 wants an Error suffix. These five names ARE the error taxonomy from the
# architecture (denied / absent / unresolved / degraded / failed), and `raise Denied(...)`
# is how the design is written down. Renaming them would make the code stop matching the spec.
"src/brain/core/errors.py" = ["N818"]
"src/brain/ops/sweeps.py" = ["N818"]  # SweepFailure reads as a result, not an error type
# docs_routes embeds a complete HTML page; CSS declarations are not wrapped at 100 columns.
"src/brain/docs_routes.py" = ["E501"]

# ---------------------------------------------------------------- mypy
[tool.mypy]
python_version = "3.13"
strict = true
warn_unreachable = true
warn_return_any = true
disallow_any_explicit = false
show_error_codes = true
files = ["src", "tests"]

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

# ---------------------------------------------------------------- pytest
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers --strict-config"
markers = [
    "invariant: a rule the system must never break; failure blocks deploy",
    "needs_db: requires a live PostgreSQL; skipped when DATABASE_URL is unset",
]

[tool.coverage.run]
source = ["src/brain"]
branch = true

[tool.coverage.report]
fail_under = 80
show_missing = true
