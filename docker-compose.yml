# The stack Coolify deploys.
#
# Sizing note, written down because the host it lands on is shared: that box already runs
# ~29 containers using about 4.5 GiB of 11.7 GiB, including a different live project.
# Every service below therefore carries an explicit memory limit. Without limits, one
# runaway query in this stack would take down someone else's production.
#
# There is no migrate service. Migrations run inside the application's startup, under a
# PostgreSQL advisory lock, before readiness passes — see src/brain/migrate.py. A one-shot
# container did the job correctly but exits when it succeeds, and Coolify has no way to be
# told a container is meant to stop, so a successful migration displayed as a red "Exited"
# beside three healthy services.
#
# Task ids: M0.4.1, M0.4.2, M38.1.3

services:
  app:
    image: ${APP_IMAGE:-ghcr.io/rpsj2230/verz-brain-v2.0:latest}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      cache:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://brain:${POSTGRES_PASSWORD}@db:5432/brain
      VALKEY_URL: redis://cache:6379/0
      BRAIN_ENV: ${BRAIN_ENV:-production}
      BRAIN_COMMIT_SHA: ${BRAIN_COMMIT_SHA:-unknown}
      APP_ROLE_PASSWORD: ${APP_ROLE_PASSWORD:-}
    deploy:
      resources:
        limits:
          memory: 1024M
    healthcheck:
      # Readiness, not liveness. A container that is up but cannot reach its database
      # still answers questions, from whatever it can still reach.
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health/ready',timeout=4).status==200 else 1)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 45s

  db:
    image: pgvector/pgvector:pg18
    restart: unless-stopped
    environment:
      POSTGRES_USER: brain
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: brain
    volumes:
      # PostgreSQL 18 changed this. Earlier images took the volume at
      # /var/lib/postgresql/data; 18+ expects it one level up and keeps data in a
      # major-version subdirectory, so pg_upgrade --link never crosses a mount boundary.
      # Mounting the old path makes 18 refuse to start with a message about finding data
      # in an "unused mount/volume", which reads like corruption but is only convention.
      - brain-db:/var/lib/postgresql
    # Not published to the host. Nothing outside this compose project reaches the
    # database, which matters more than usual on a box with no firewall.
    expose:
      - "5432"
    command: >
      postgres
      -c shared_buffers=512MB
      -c work_mem=16MB
      -c maintenance_work_mem=256MB
      -c max_connections=100
    deploy:
      resources:
        limits:
          memory: 2048M
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U brain -d brain"]
      interval: 10s
      timeout: 5s
      retries: 10

  cache:
    image: valkey/valkey:8-alpine
    restart: unless-stopped
    command: ["valkey-server", "--maxmemory", "384mb", "--maxmemory-policy", "allkeys-lru", "--save", ""]
    expose:
      - "6379"
    deploy:
      resources:
        limits:
          memory: 512M
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  brain-db:
