# The stack Coolify deploys.
#
# Sizing note, written down because the host it lands on is shared: this box already runs
# ~29 containers using about 4.5 GiB of 11.7 GiB, including a different live project.
# Every service below therefore carries an explicit memory limit. Without limits, one
# runaway query in this stack would take down someone else's production.
#
# Task ids: M0.4.1, M0.4.2, M38.1.3

services:
  app:
    image: ${APP_IMAGE:-ghcr.io/rpsj2230/verz-brain-v2.0:latest}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      cache:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://brain:${POSTGRES_PASSWORD}@db:5432/brain
      VALKEY_URL: redis://cache:6379/0
      BRAIN_ENV: ${BRAIN_ENV:-production}
      BRAIN_COMMIT_SHA: ${BRAIN_COMMIT_SHA:-unknown}
    deploy:
      resources:
        limits:
          memory: 1024M
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health/ready',timeout=4).status==200 else 1)"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s

  # Migrations run to completion before the app takes traffic. As a one-shot service
  # rather than an app entrypoint step, so two app replicas cannot race the same migration.
  migrate:
    image: ${APP_IMAGE:-ghcr.io/rpsj2230/verz-brain-v2.0:latest}
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://brain:${POSTGRES_PASSWORD}@db:5432/brain
    command: ["alembic", "upgrade", "head"]
    deploy:
      resources:
        limits:
          memory: 256M

  db:
    image: pgvector/pgvector:pg18
    restart: unless-stopped
    environment:
      POSTGRES_USER: brain
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: brain
    volumes:
      # PostgreSQL 18 changed this. Earlier images took the volume at
      # /var/lib/postgresql/data; 18+ expects it one level up at /var/lib/postgresql and
      # keeps data in a major-version subdirectory, so that pg_upgrade --link can work
      # without crossing a mount boundary. Mounting the old path makes 18 refuse to start
      # with "there appears to be PostgreSQL data in /var/lib/postgresql/data (unused
      # mount/volume)" — which reads like corruption but is only a path convention change.
      - brain-db:/var/lib/postgresql
    # Not published to the host. Nothing outside this compose project reaches the
    # database, which matters more than usual on a box with no firewall.
    expose:
      - "5432"
    command: >
      postgres
      -c shared_buffers=512MB
      -c work_mem=16MB
      -c maintenance_work_mem=256MB
      -c max_connections=100
    deploy:
      resources:
        limits:
          memory: 2048M
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U brain -d brain"]
      interval: 10s
      timeout: 5s
      retries: 10

  cache:
    image: valkey/valkey:8-alpine
    restart: unless-stopped
    command: ["valkey-server", "--maxmemory", "384mb", "--maxmemory-policy", "allkeys-lru", "--save", ""]
    expose:
      - "6379"
    deploy:
      resources:
        limits:
          memory: 512M
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  brain-db:
