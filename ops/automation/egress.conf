# The only route out of the automation sandbox.
#
# `brain.ops.automation.EGRESS_ALLOWLIST` is the source of truth and this file is the
# deployment of it. `tests/unit/test_automation_deployment.py` holds the two equal, because
# an allowlist that exists only as a Python constant is an allowlist nothing enforces, and
# two copies of five hostnames are safe exactly as long as something compares them.
#
# WHY A PROXY RATHER THAN A RULE INSIDE THE CANVAS. The flows here are assembled by a
# client's own staff, so the code inside the sandbox is written by somebody outside this
# repository. An allowlist checked inside the sandbox is an allowlist the sandbox can edit.
# This runs in a different container, on a network the canvas cannot reach past, and the
# canvas has no route to the internet at all: `automation` is an internal network and this
# proxy is the only service also attached to one that is not.
#
# EXACT HOSTNAMES, NEVER SUFFIXES. `dstdomain api.xero.com` with no leading dot matches that
# host and nothing else. Squid's leading-dot form (`.xero.com`) matches every subdomain, and
# `brain.ops.automation` records at length why that is the bug rather than the convenience:
# a suffix admits any host somebody can register whose name ends in the right characters.
# A genuine subdomain that is needed later is written out as its own line.
#
# WHAT IS DELIBERATELY ABSENT. No CONNECT to arbitrary ports, no ICP, no cache peering, and
# no `http_access allow localnet` line. The default is deny and every allowance below is
# narrower than the one above it.
#
# Task ids: M32.6.1.1

# ------------------------------------------------------------------ what may be reached
# Generated from brain.ops.automation.EGRESS_ALLOWLIST. Sorted, so the file and the constant
# compare as text rather than only as meaning.
acl allowed_sources dstdomain api.xero.com
acl allowed_sources dstdomain graph.microsoft.com
acl allowed_sources dstdomain hooks.slack.com
acl allowed_sources dstdomain open.feishu.cn
acl allowed_sources dstdomain open.larksuite.com

# ------------------------------------------------------------------ who may ask
# The sandbox network only. The proxy is reachable from nowhere else, and saying so here
# means a misconfigured network still does not turn this into an open relay.
acl sandbox src 172.16.0.0/12
acl sandbox src 10.0.0.0/8

# ------------------------------------------------------------------ how
# 443 alone. A flow that wants plain HTTP to an allowlisted host is a flow sending a client's
# data across the internet in clear, and the allowlist is about where rather than whether.
acl SSL_ports port 443
acl CONNECT method CONNECT

http_access deny !sandbox
http_access deny CONNECT !SSL_ports
http_access allow sandbox allowed_sources SSL_ports
http_access deny all

http_port 3128

# No stored copies of anything that passed through. A cache here is a second place a
# client's data lives, on a host whose whole premise is that its contents are untrusted.
cache deny all
cache_dir null /tmp

# The hostname a refusal reports. Named rather than left to the container's id, so an
# operator reading a flow's error sees which boundary refused it.
visible_hostname automation-egress
