name: Deploy

# Laptop -> GitHub -> registry -> VPS. Nothing deploys that has not passed CI, and the
# image is tagged with the commit SHA so "what is live" is always answerable exactly.
#
# Task ids: M38.1.2, M38.1.3

on:
  workflow_run:
    workflows: ["CI"]
    branches: [main]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  # Keyless signing binds the signature to this workflow's OIDC identity. Without it
  # cosign has nothing to prove who signed, and falls back to wanting a private key —
  # which would then have to live somewhere, be rotated, and be revocable. This way
  # there is no key to steal.
  id-token: write

env:
  REGISTRY: ghcr.io
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  build:
    name: Build and publish image
    # A red CI must never reach the server. workflow_run fires regardless of outcome,
    # so the conclusion is checked explicitly rather than assumed.
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.meta.outputs.sha }}
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          # Progress is computed from the whole history, so a shallow clone would
          # report only the last commit's worth of work.
          fetch-depth: 0

      - id: meta
        run: echo "sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      # The tracker and the status page are generated, never hand-edited. Both are built
      # here so what ships always matches the commit it shipped from — a tracker committed
      # by hand would drift the moment someone forgot to regenerate it.
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Regenerate tracker from the WBS
        run: |
          node docs/wbs/export.js
          node docs/wbs/render.js
      - uses: astral-sh/setup-uv@v5
        with:
          version: ${{ env.UV_VERSION }}
      - name: Compute progress from git history
        run: |
          uv sync --locked
          uv run python -m brain.status
          cat docs/status.json | head -20

      - name: Write the release manifest into the build context
        # Computed here because this is the only machine in the chain that has a git
        # repository. The server that runs the deploy does not, and neither does the
        # container. Calling back to GitHub from the deploy script instead would make a
        # deploy depend on an API being reachable at the moment it happens, which is the
        # moment it is least likely to be.
        #
        # `fetch-depth: 0` above is what makes this work; a shallow clone has no tags and
        # the manifest would silently carry no task ids.
        run: |
          uv run python -m brain.ops.release_manifest > RELEASE.json
          cat RELEASE.json

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            COMMIT_SHA=${{ steps.meta.outputs.sha }}
          tags: |
            ${{ env.IMAGE }}:${{ steps.meta.outputs.sha }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true

      - uses: sigstore/cosign-installer@v3.7.0

      - name: Sign the image, keylessly
        # Signs the digest, not the tag. A tag is a moving pointer, so signing `:latest`
        # attests to whatever it happens to point at today — which is exactly the thing an
        # attacker moves. The digest is the image.
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          cosign sign --yes "${{ env.IMAGE }}@${DIGEST}"
          echo "signed ${{ env.IMAGE }}@${DIGEST}"

      - name: Verify the signature we just made
        # A signing step nobody verifies is a signing step that silently stops working.
        # This checks the signature is bound to this repository and this workflow, so a
        # signature made by some other workflow on some other repo would not pass.
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          cosign verify "${{ env.IMAGE }}@${DIGEST}"             --certificate-identity-regexp "^https://github.com/${{ github.repository }}/"             --certificate-oidc-issuer https://token.actions.githubusercontent.com             > /dev/null
          echo "signature verifies against ${{ github.repository }}"


  deploy:
    name: Trigger Coolify
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy
        env:
          # Coolify's generic deploy endpoint. It handles Service resources as well as
          # Applications (DeployController::deploy_resource -> StartService), which is why
          # the stack stays a Service: Services have no git webhook, but they do not need
          # one. Calling the API from here keeps the CI gate — a red build never reaches
          # the server, which a push webhook could not guarantee.
          COOLIFY_URL: ${{ secrets.COOLIFY_URL }}
          SERVICE_UUID: ${{ secrets.COOLIFY_SERVICE_UUID }}
          TOKEN: ${{ secrets.COOLIFY_TOKEN }}
          SHA: ${{ needs.build.outputs.sha }}
        run: |
          if [ -z "$COOLIFY_URL" ] || [ -z "$TOKEN" ] || [ -z "$SERVICE_UUID" ]; then
            echo "Coolify secrets not set - skipping deploy."
            echo "Image ghcr.io/${{ github.repository }}:$SHA is published and ready to pull."
            exit 0
          fi
          echo "Deploying $SHA to service $SERVICE_UUID"
          code=$(curl -sS -o /tmp/out -w '%{http_code}'                    -X POST "$COOLIFY_URL/api/v1/deploy?uuid=$SERVICE_UUID"                    -H "Authorization: Bearer $TOKEN"                    -H "Content-Type: application/json")
          cat /tmp/out; echo
          if [ "$code" -ge 300 ]; then
            echo "::error::Coolify returned $code"
            exit 1
          fi

      - name: Record what shipped
        if: success()
        run: |
          echo "### Deployed" >> "$GITHUB_STEP_SUMMARY"
          echo "- commit \`${{ needs.build.outputs.sha }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- image \`ghcr.io/${{ github.repository }}:${{ needs.build.outputs.sha }}\`" >> "$GITHUB_STEP_SUMMARY"
